# Каждый пуш в основную ветку выпускает новый релиз v<mod_version>.<номер сборки>:
# клиент, установщик, extras.zip (файлы для папки клиента) и manifest.json.
# Кнопка «Обновить» в установщике сравнивает установленную версию с последним релизом.
name: Release

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          BASE=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$BASE.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Версия релиза: $BASE.${{ github.run_number }}"

  client:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon -Pmod_version=${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: build/libs/visual-client-${{ needs.version.outputs.version }}.jar
          if-no-files-found: error

  installer:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r installer/requirements.txt pyinstaller==6.11.1
      - run: >
          pyinstaller --noconfirm --onefile --windowed
          --name VisualClientInstaller
          --collect-data customtkinter
          --paths installer
          installer/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/VisualClientInstaller.exe
          if-no-files-found: error

  release:
    needs: [version, client, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: extras.zip — файлы, которые установщик кладёт в папку клиента
        run: |
          python3 - <<'PY'
          import shutil, zipfile
          from pathlib import Path
          with zipfile.ZipFile("dist/extras.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for f in sorted(Path("package").rglob("*")):
                  if f.is_file():
                      zf.write(f, f.relative_to("package").as_posix())
              # Батник обновления = тот же install.bat: качает свежий установщик и запускает его
              zf.write("install.bat", "Обновить клиент.bat")
              print("\n".join(zf.namelist()))
          PY
      - name: manifest.json
        run: |
          get() { grep "^$1=" gradle.properties | cut -d= -f2 | tr -d '[:space:]'; }
          VERSION="${{ needs.version.outputs.version }}"
          JAR="visual-client-$VERSION.jar"
          cat > dist/manifest.json <<JSON
          {
            "version": "$VERSION",
            "minecraft": "$(get minecraft_version)",
            "loader": "$(get loader_version)",
            "fabric_api": "$(get fabric_version)",
            "client_jar": "$JAR",
            "client_sha256": "$(sha256sum "dist/$JAR" | cut -d' ' -f1)",
            "extras_sha256": "$(sha256sum dist/extras.zip | cut -d' ' -f1)"
          }
          JSON
          cat dist/manifest.json
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          CHANGES=$(git log -1 --format='%s')
          cat > notes.md <<NOTES
          **Установка:** скачайте \`VisualClientInstaller.exe\`, запустите и нажмите «Установить».
          Затем откройте лаунчер Minecraft и выберите профиль «Visual Client».

          **Обновление:** запустите «Обновить клиент.bat» из папки клиента (или установщик) и нажмите «Обновить».

          Изменение: ${CHANGES}
          NOTES
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Visual Client $VERSION" \
            --notes-file notes.md \
            --latest
