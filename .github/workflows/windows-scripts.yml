# Проверяет install.bat и run-dev.bat на чистой Windows (без Java в PATH).
name: Windows scripts

on:
  push:
    paths:
      - install.bat
      - run-dev.bat
      - scripts/**
      - .github/workflows/windows-scripts.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: install.bat скачивает установщик
        shell: cmd
        env:
          VC_NO_START: "1"
        run: |
          call install.bat || exit /b 1
          if not exist "%TEMP%\VisualClientInstaller.exe" exit /b 1
          for %%F in ("%TEMP%\VisualClientInstaller.exe") do echo Размер: %%~zF байт

      - name: run-dev.bat сам ставит Java и собирает клиент
        shell: pwsh
        run: |
          # Убираем любую Java, чтобы проверить автоматическое скачивание
          $env:JAVA_HOME = ""
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch '(?i)java|jdk|jre' }) -join ';'
          if (Get-Command java -ErrorAction SilentlyContinue) { throw "Java всё ещё в PATH" }
          cmd /c "echo.| run-dev.bat build"
          if (-not (Test-Path .jdk\bin\java.exe)) { throw "Java не скачалась в .jdk" }
          if (-not (Get-ChildItem build\libs\visual-client-*.jar)) { throw "Клиент не собрался" }
          # Второй запуск должен взять уже скачанную Java
          cmd /c "echo.| run-dev.bat build" | Select-String "Java:"
